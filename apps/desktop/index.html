<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wingmate</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font: 16px/1.6 system-ui, sans-serif;
      color: #162641;
      background: #f2f6fc;
    }
    main {
      width: min(100%, 460px);
      padding: 30px 32px;
      border: 1px solid #dce5f2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 40px rgb(32 63 112 / 8%);
    }
    header { display: flex; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0; font-size: 21px; }
    .status { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
    .spinner {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 2px solid #dce8fa;
      border-top-color: #326bd9;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    p { margin: 8px 0 0; color: #4d607d; }
    details { margin-top: 16px; color: #4d607d; }
    summary { cursor: pointer; }
    pre {
      max-height: 160px;
      overflow: auto;
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f2f6fc;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.svg" width="42" height="42" alt="">
      <h1>Wingmate</h1>
    </header>
    <div role="status" aria-live="polite" aria-atomic="true">
      <div class="status">
        <span id="spinner" class="spinner" aria-hidden="true"></span>
        <h2 id="message">正在检查后台…</h2>
      </div>
      <p id="hint" hidden></p>
    </div>
    <details id="details" hidden>
      <summary>查看错误详情</summary>
      <pre id="error"></pre>
    </details>
  </main>
</body>
</html>
