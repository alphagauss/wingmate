<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>远程连接</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    --surface: light-dark(#fff, #292a2d);
    --ink: light-dark(#0f1115, #f1f1f1);
    --muted: light-dark(#61666b, #adadb2);
    --line: light-dark(#0000001a, #ffffff24);
    --hover: light-dark(#2631480f, #ffffff12);
    --press: light-dark(#2631481a, #ffffff20);
    --accent: light-dark(#4176e6, #90acff);
    --selected: light-dark(#edf2ff, #343b59);
    --primary: light-dark(#0f1115, #f1f1f1);
    --primary-hover: light-dark(#43454a, #d8d8db);
    --error: light-dark(#b42318, #ffa39e);
    margin: 0; color: var(--ink); background: var(--surface);
  }
  main { padding: 14px; overflow: auto; }
  header, .row { display: flex; align-items: center; gap: 8px; }
  header { justify-content: space-between; margin-bottom: 8px; }
  h1, p { margin: 0; }
  h1 { font-size: 14px; font-weight: 600; }
  button, input { font: inherit; color: inherit; }
  button {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    min-height: 30px; border: 0; border-radius: 8px; padding: 0 10px;
    background: var(--hover); cursor: pointer;
  }
  button:hover { background: var(--press); }
  button:active { background: color-mix(in srgb, var(--press) 80%, var(--ink)); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #close { width: 26px; min-height: 26px; padding: 0; background: transparent; color: var(--muted); }
  #close:hover { background: var(--hover); }
  [role="tablist"] { display: flex; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  [role="tab"] { background: transparent; color: var(--muted); }
  [role="tab"]:hover { background: var(--hover); }
  [role="tab"][aria-selected="true"] { background: var(--selected); color: var(--accent); font-weight: 600; }
  [role="tabpanel"] { padding-top: 12px; }
  label { display: block; margin: 0 0 5px; font-weight: 500; }
  input {
    width: 100%; min-width: 0; min-height: 30px; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; background: var(--surface);
  }
  .primary { background: var(--primary); color: var(--surface); }
  .primary:hover { background: var(--primary-hover); }
  .primary:active { background: color-mix(in srgb, var(--primary-hover) 85%, var(--surface)); }
  .muted { color: var(--muted); font-size: 12px; }
  .share-row { display: grid; grid-template-columns: minmax(0, 139px) minmax(0, 1fr); justify-items: start; min-height: 28px; }
  .share-row + .share-row { margin-top: 8px; }
  .share-row p { overflow-wrap: anywhere; }
  .share-action {
    width: 128px; min-height: 27px; padding: 0 8px; border-radius: 6px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  #local-pair[aria-disabled="true"] { color: var(--accent); background: var(--selected); cursor: default; }
  #saved, #share-result, #message, .settings-hint { margin-top: 10px; }
  #current { margin-bottom: 9px; }
  #message { color: var(--error); overflow-wrap: anywhere; }
  #message:empty { display: none; }
  #host-picker { width: 100%; justify-content: space-between; gap: 8px; }
  #host-picker > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #host-picker[aria-expanded="true"] svg { transform: rotate(180deg); }
  #host-options {
    display: grid; gap: 2px; max-height: 156px; overflow: auto;
    margin-top: 4px; padding: 4px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface);
  }
  #host-options button { justify-content: space-between; gap: 8px; min-width: 0; background: transparent; text-align: start; overflow-wrap: anywhere; }
  #host-options button:hover, #host-options button:focus-visible { background: var(--hover); }
  #host-options button:focus-visible { outline-offset: -2px; }
  #host-options button[aria-selected="true"]::after { content: '✓'; color: var(--accent); }
  .pairing-card {
    display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px; align-items: start;
    padding: 10px; border: 1px solid var(--line); border-radius: 10px;
    background: light-dark(#f8f9fb, #232427);
  }
  #share-code { display: block; width: 124px; height: 124px; border-radius: 6px; background: white; }
  .pairing-details { display: grid; gap: 6px; align-self: center; justify-items: start; min-width: 0; }
  .pairing-heading { font-size: 13px; font-weight: 600; }
  .pairing-address {
    min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace;
  }
  #share-address { line-height: 26px; }
  #share-address-picker { position: relative; min-width: 0; width: 100%; }
  #share-address-picker summary {
    display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 26px;
    padding: 0 7px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); cursor: pointer; list-style: none;
  }
  #share-address-picker summary::-webkit-details-marker { display: none; }
  #share-address-picker summary:hover { background: var(--hover); }
  #share-address-picker[open] summary { background: var(--selected); border-color: transparent; }
  #share-address-picker svg { flex: none; color: var(--muted); }
  #share-address-picker[open] svg { transform: rotate(180deg); }
  #share-address-picker[open] ~ #share-copy, #share-address-picker[open] ~ .muted {
    opacity: 0; pointer-events: none;
  }
  #share-address-options {
    position: absolute; z-index: 1; inset-inline: 0; top: calc(100% + 4px);
    display: grid; gap: 1px; max-height: 68px; overflow: auto; overscroll-behavior: contain; scrollbar-width: none;
    padding: 2px 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
    box-shadow: 0 4px 12px light-dark(#0f11151f, #0005);
  }
  #share-address-options::-webkit-scrollbar { display: none; }
  #share-address-options button {
    justify-content: start; min-height: 20px; min-width: 0; padding: 0 4px;
    border-radius: 4px; background: transparent;
  }
  #share-address-options button:hover { background: var(--hover); }
  #share-address-options button:focus-visible { outline-offset: -2px; }
  #share-address-options button[aria-pressed="true"] {
    color: light-dark(#2856ae, #a9bfff); background: var(--selected); font-weight: 600;
  }
  #share-copy { min-height: 26px; width: 76px; padding: 0 6px; border-radius: 6px; font-size: 12px; }
  #share-copy.copied { color: var(--accent); background: var(--selected); }
  #share-link { margin: 8px 0 0; white-space: normal; overflow-wrap: anywhere; user-select: text; }
</style>
<main aria-labelledby="heading">
  <header>
    <h1 id="heading">远程连接</h1>
    <button id="close" type="button" aria-label="关闭" title="关闭">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>
    </button>
  </header>
  <div role="tablist" aria-label="远程连接">
    <button id="connect-tab" type="button" role="tab" aria-selected="true" aria-controls="connect">连接主机</button>
    <button id="share-tab" type="button" role="tab" aria-selected="false" aria-controls="share" tabindex="-1">分享本机</button>
  </div>
  <section id="connect" role="tabpanel" aria-labelledby="connect-tab">
    <p id="current" class="muted" hidden></p>
    <form>
      <label for="link">分享链接</label>
      <div class="row">
        <input id="link" type="url" required autocomplete="off" placeholder="http://192.168.1.10:12345/">
        <button class="primary" type="submit">连接</button>
      </div>
    </form>
    <div id="saved" hidden>
      <label id="saved-label" for="host-picker">最近连接</label>
      <button id="host-picker" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="host-options" aria-labelledby="saved-label host-value">
        <span id="host-value">选择主机</span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <div id="host-options" role="listbox" aria-labelledby="saved-label" hidden>
        <button type="button" role="option" aria-selected="false" tabindex="-1" data-address="" hidden>取消选择</button>
      </div>
    </div>
  </section>
  <section id="share" role="tabpanel" aria-labelledby="share-tab" hidden>
    <div class="row share-row">
      <p id="local-web-status" role="status">本机浏览器</p>
      <button id="local-pair" class="share-action" type="button" aria-live="polite" hidden>复制本机配对链接</button>
    </div>
    <div class="row share-row">
      <p id="share-status" class="muted" role="status"></p>
      <button id="share-enable" class="share-action" type="button" hidden>开启分享</button>
      <button id="share-pair" class="share-action" type="button" hidden>生成配对码</button>
    </div>
    <div id="share-result" hidden>
      <div class="pairing-card">
        <img id="share-code" width="124" height="124" alt="局域网配对二维码">
        <div class="pairing-details">
          <p class="pairing-heading">扫码配对</p>
          <p id="share-address" class="pairing-address"></p>
          <details id="share-address-picker" hidden>
            <summary title="切换配对地址">
              <span id="share-address-value" class="pairing-address"></span>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </summary>
            <div id="share-address-options" role="group" aria-label="配对地址"></div>
          </details>
          <button id="share-copy" type="button" aria-live="polite">复制链接</button>
          <p class="muted">5 分钟内可用一次</p>
        </div>
      </div>
      <p id="share-link" class="pairing-address" hidden></p>
    </div>
    <p class="settings-hint muted">在「Wingmate 后台服务」管理分享和设备。</p>
  </section>
  <p id="message" role="alert"></p>
</main>
<script type="module" src="./connections.js"></script>
</html>
