<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wingmate 连接</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  [hidden] { display: none !important; }
  body { margin: 0; color: CanvasText; background: Canvas; }
  header {
    box-sizing: border-box; height: 40px; display: flex; align-items: center;
    gap: 12px; padding: 0 12px; position: relative; z-index: 1200; pointer-events: none;
  }
  header button { pointer-events: auto; }
  header[data-windows] { padding-right: 148px; }
  #current { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toggle { margin-left: auto; }
  main { width: min(32rem, calc(100% - 2rem)); margin: 40px auto; }
  label, #hosts { display: block; margin-bottom: 8px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; }
  button, input, select { font: inherit; padding: 6px 10px; border-radius: 6px; }
  button { cursor: pointer; }
  #message { min-height: 1.5em; }
</style>
<header>
  <span id="current" role="status">本机</span>
  <button type="button" id="toggle" hidden>连接</button>
  <button type="button" id="local">返回本机</button>
</header>
<main>
  <h1>连接 Wingmate 主机</h1>
  <label for="hosts" id="saved-label" hidden>已连接过的主机</label>
  <select id="hosts" aria-labelledby="saved-label" hidden></select>
  <label for="link">分享链接</label>
  <form>
    <input id="link" type="url" required autocomplete="off" placeholder="http://192.168.1.10:12345/">
    <button type="submit">连接</button>
  </form>
  <p id="message" role="status"></p>
</main>
<script type="module" src="./connections.js"></script>
</html>
