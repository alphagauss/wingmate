<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程连接</title>
  <style>
  :root {
    color-scheme: light dark;
    --panel-width: min(356px, calc(100vw - 16px));
    --panel-top: clamp(
      8px,
      calc(var(--anchor-top) + 4px),
      max(8px, calc(100dvh - 128px))
    );
    --panel-right: clamp(
      8px,
      var(--anchor-right),
      calc(100vw - var(--panel-width) - 8px)
    );
    font:
      13px / 1.5 system-ui,
      sans-serif;
    overflow: hidden;
  }
  :root[data-theme="light"] {
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  body {
    --surface: light-dark(#fff, #292a2d);
    --ink: light-dark(#0f1115, #f1f1f1);
    --muted: light-dark(#61666b, #adadb2);
    --line: light-dark(#0000001a, #ffffff24);
    --hover: light-dark(#2631480f, #ffffff12);
    --press: light-dark(#2631481a, #ffffff20);
    --accent: light-dark(#4176e6, #90acff);
    --input-focus: light-dark(#4176e6, #7aaaff);
    --input-border: light-dark(#00000029, #fff3);
    --selected: light-dark(#edf2ff, #343b59);
    --primary: light-dark(#0f1115, #f1f1f1);
    --primary-hover: light-dark(#43454a, #d8d8db);
    --error: light-dark(#b42318, #ffa39e);
    margin: 0;
    color: var(--ink);
  }
  dialog {
    position: fixed;
    inset: var(--panel-top) var(--panel-right) auto auto;
    margin: 0;
    width: var(--panel-width);
    max-width: none;
    max-height: min(560px, calc(100dvh - var(--panel-top) - 8px));
    padding: 14px;
    overflow: auto;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 8px 28px light-dark(#0f111533, #0008);
  }
  dialog::backdrop {
    background: transparent;
  }
  :root[data-password-only] dialog {
    inset: 0;
    margin: auto;
    width: min(440px, calc(100vw - 24px));
  }
  :root[data-password-only] dialog::backdrop {
    background: #0004;
  }
  :root[data-password-only] [role="tablist"],
  :root[data-password-only] #share > :not(#lan-password-form) {
    display: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] {
      animation: panel-in 150ms ease-out;
    }
  }
  @keyframes panel-in {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }
  }
  header,
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header {
    justify-content: space-between;
    margin-bottom: 8px;
  }
  h1,
  p {
    margin: 0;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
  }
  button,
  input {
    font: inherit;
    color: inherit;
  }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    min-height: 30px;
    border: 0;
    border-radius: 8px;
    padding: 0 10px;
    background: var(--hover);
    cursor: pointer;
  }
  button:hover {
    background: var(--press);
  }
  button:active {
    background: color-mix(in srgb, var(--press) 80%, var(--ink));
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #close {
    width: 26px;
    min-height: 26px;
    padding: 0;
    background: transparent;
    color: var(--muted);
  }
  #close:hover {
    background: var(--hover);
  }
  [role="tablist"] {
    display: flex;
    gap: 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  [role="tab"] {
    background: transparent;
    color: var(--muted);
  }
  [role="tab"]:hover {
    background: var(--hover);
  }
  [role="tab"][aria-selected="true"] {
    background: var(--selected);
    color: var(--accent);
    font-weight: 600;
  }
  [role="tabpanel"] {
    padding-top: 12px;
  }
  label {
    display: block;
    margin: 0 0 5px;
    font-weight: 500;
  }
  input,
  select {
    width: 100%;
    min-width: 0;
    min-height: 30px;
    border: 0.5px solid var(--input-border);
    border-radius: 6px;
    padding: 4px 8px;
    background: var(--surface);
    color: var(--ink);
  }
  input:focus,
  select:focus {
    outline: none;
    border-color: var(--input-focus);
  }
  input::-ms-reveal {
    display: none;
  }
  .password-field {
    position: relative;
    min-width: 0;
    flex: 1;
  }
  .password-field input {
    padding-right: 32px;
  }
  .password-eye {
    position: absolute;
    inset: 1px 1px 1px auto;
    min-height: 0;
    width: 30px;
    padding: 0;
    background: transparent;
    color: var(--muted);
  }
  .password-eye[aria-pressed="false"] .eye-slash {
    display: none;
  }
  .password-eye svg {
    width: 16px;
    height: 16px;
  }
  .input-error {
    color: var(--error);
  }
  .input-error:empty {
    display: none;
  }
  #lan-search {
    margin-top: 12px;
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  #lan-search .row:first-child {
    justify-content: space-between;
  }
  #scan-lan {
    inline-size: 92px;
  }
  #lan-hosts {
    display: grid;
    margin-top: 4px;
  }
  .lan-host {
    width: 100%;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    padding: 5px 8px;
    background: transparent;
  }
  .lan-host-name {
    display: block;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .lan-host[aria-expanded="true"] .lan-host-arrow {
    transform: rotate(180deg);
  }
  .lan-host-arrow {
    transition: transform 0.16s ease;
  }
  .lan-fold:not([hidden]) {
    display: grid;
    grid-template-rows: 1fr;
    animation: lan-expand 0.18s ease-out;
  }
  .lan-fold > div {
    min-height: 0;
    overflow: hidden;
  }
  .lan-auth {
    margin: 2px 4px 8px;
    padding: 8px;
    border-radius: 8px;
    background: var(--hover);
  }
  .lan-auth label {
    margin-bottom: 4px;
  }
  .lan-auth .input-error {
    margin-top: 5px;
  }
  @keyframes lan-expand {
    from {
      grid-template-rows: 0fr;
      opacity: 0.6;
    }
  }
  #lan-password-form {
    margin-top: 9px;
  }
  #lan-password-row,
  #lan-password-note {
    justify-content: space-between;
  }
  #lan-password-row label {
    flex: none;
    margin: 0;
  }
  #lan-password-row .password-field:not([hidden]) {
    animation: show-password-field 0.18s ease-out;
  }
  @keyframes show-password-field {
    from {
      opacity: 0;
      transform: translateX(-4px);
    }
  }
  #lan-password-note {
    margin-top: 5px;
  }
  #lan-password-note button {
    min-height: 24px;
    font-size: 12px;
  }
  #tunnel-duration {
    width: auto;
    font: inherit;
  }
  #tunnel-actions {
    flex-wrap: wrap;
  }
  #tunnel-invite {
    margin: 8px 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .lan-fold:not([hidden]),
    #lan-password-row .password-field:not([hidden]) {
      animation: none;
    }
    .lan-host-arrow {
      transition: none;
    }
  }
  .primary {
    background: var(--primary);
    color: var(--surface);
  }
  .primary:hover {
    background: var(--primary-hover);
  }
  .primary:active {
    background: color-mix(in srgb, var(--primary-hover) 85%, var(--surface));
  }
  .muted {
    color: var(--muted);
    font-size: 12px;
  }
  .share-row {
    display: grid;
    grid-template-columns: minmax(0, 139px) minmax(0, 1fr);
    justify-items: start;
    min-height: 28px;
  }
  .share-row + .share-row {
    margin-top: 8px;
  }
  .share-row p {
    overflow-wrap: anywhere;
  }
  .share-action {
    width: 128px;
    min-height: 27px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  #local-pair[aria-disabled="true"] {
    color: var(--accent);
    background: var(--selected);
    cursor: default;
  }
  #saved,
  #share-result,
  #tunnel-result,
  #message,
  .settings-hint {
    margin-top: 10px;
  }
  #current {
    margin-bottom: 9px;
  }
  #message {
    color: var(--error);
    overflow-wrap: anywhere;
  }
  #message:empty {
    display: none;
  }
  #host-picker {
    width: 100%;
    justify-content: space-between;
    gap: 8px;
  }
  #host-picker > span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #host-picker[aria-expanded="true"] svg {
    transform: rotate(180deg);
  }
  #host-options {
    display: grid;
    gap: 2px;
    max-height: 156px;
    overflow: auto;
    margin-top: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  #host-options button {
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    background: transparent;
    text-align: start;
    overflow-wrap: anywhere;
  }
  #host-options button:hover,
  #host-options button:focus-visible {
    background: var(--hover);
  }
  #host-options button:focus-visible {
    outline-offset: -2px;
  }
  #host-options button[aria-selected="true"]::after {
    content: "✓";
    color: var(--accent);
  }
  .pairing-card {
    display: grid;
    grid-template-columns: 124px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: light-dark(#f8f9fb, #232427);
  }
  .pairing-card img {
    display: block;
    width: 124px;
    height: 124px;
    border-radius: 6px;
    background: white;
  }
  .pairing-details {
    display: grid;
    gap: 6px;
    align-self: center;
    justify-items: start;
    min-width: 0;
  }
  .pairing-heading {
    font-size: 13px;
    font-weight: 600;
  }
  .pairing-address {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font:
      11px / 1.5 ui-monospace,
      Consolas,
      monospace;
  }
  #share-address {
    line-height: 26px;
  }
  #share-address-picker {
    position: relative;
    min-width: 0;
    width: 100%;
  }
  #share-address-picker summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    min-height: 26px;
    padding: 0 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    list-style: none;
  }
  #share-address-picker summary::-webkit-details-marker {
    display: none;
  }
  #share-address-picker summary:hover {
    background: var(--hover);
  }
  #share-address-picker[open] summary {
    background: var(--selected);
    border-color: transparent;
  }
  #share-address-picker svg {
    flex: none;
    color: var(--muted);
  }
  #share-address-picker[open] svg {
    transform: rotate(180deg);
  }
  #share-address-picker[open] ~ #share-copy,
  #share-address-picker[open] ~ .muted {
    opacity: 0;
    pointer-events: none;
  }
  #share-address-options {
    position: absolute;
    z-index: 1;
    inset-inline: 0;
    top: calc(100% + 4px);
    display: grid;
    gap: 1px;
    max-height: 68px;
    overflow: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding: 2px 3px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    box-shadow: 0 4px 12px light-dark(#0f11151f, #0005);
  }
  #share-address-options::-webkit-scrollbar {
    display: none;
  }
  #share-address-options button {
    justify-content: start;
    min-height: 20px;
    min-width: 0;
    padding: 0 4px;
    border-radius: 4px;
    background: transparent;
  }
  #share-address-options button:hover {
    background: var(--hover);
  }
  #share-address-options button:focus-visible {
    outline-offset: -2px;
  }
  #share-address-options button[aria-pressed="true"] {
    color: light-dark(#2856ae, #a9bfff);
    background: var(--selected);
    font-weight: 600;
  }
  #share-copy,
  #tunnel-copy {
    min-height: 26px;
    width: 76px;
    padding: 0 6px;
    border-radius: 6px;
    font-size: 12px;
  }
  #share-copy.copied {
    color: var(--accent);
    background: var(--selected);
  }
  #share-link,
  #tunnel-link {
    margin: 8px 0 0;
    white-space: normal;
    overflow-wrap: anywhere;
    user-select: text;
  }
  #tunnel {
    display: grid;
    gap: 9px;
  }
  #tunnel [aria-pressed="true"] {
    color: var(--accent);
    background: var(--selected);
    font-weight: 600;
  }
  #tunnel progress {
    width: 100%;
    height: 8px;
    accent-color: var(--accent);
  }
  #tunnel-status {
    overflow-wrap: anywhere;
  }
  </style>
  <dialog aria-labelledby="heading">
    <header>
      <h1 id="heading">远程连接</h1>
      <button id="close" type="button" aria-label="关闭" title="关闭">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
          ><path d="m4 4 8 8m0-8-8 8" /></svg
        >
      </button>
    </header>
    <div role="tablist" aria-label="远程连接">
      <button
        id="connect-tab"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="connect"
        >连接主机</button
      >
      <button
        id="share-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="share"
        tabindex="-1"
        >局域网</button
      >
      <button
        id="tunnel-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="tunnel"
        tabindex="-1"
        >公网隧道</button
      >
    </div>
    <section id="connect" role="tabpanel" aria-labelledby="connect-tab">
      <p id="current" class="muted" hidden></p>
      <form>
        <label for="link">连接地址或配对链接</label>
        <div class="row">
          <input
            id="link"
            autofocus
            type="url"
            required
            autocomplete="off"
            placeholder="http://192.168.1.10:12345/ 或 https://域名/"
          >
          <button class="primary" type="submit">连接</button>
        </div>
      </form>
      <div id="manual-auth"></div>
      <div id="saved" hidden>
        <label id="saved-label" for="host-picker">最近连接</label>
        <button
          id="host-picker"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="host-options"
          aria-labelledby="saved-label host-value"
        >
          <span id="host-value">选择主机</span>
          <svg
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            aria-hidden="true"
            ><path d="m4 6 4 4 4-4" /></svg
          >
        </button>
        <div
          id="host-options"
          role="listbox"
          aria-labelledby="saved-label"
          hidden
        >
          <button
            type="button"
            role="option"
            aria-selected="false"
            tabindex="-1"
            data-address=""
            hidden
            >取消选择</button
          >
        </div>
      </div>
      <section id="lan-search" aria-label="局域网主机">
        <div class="row"
          ><span>局域网主机</span
          ><button id="scan-lan" type="button">搜索局域网</button></div
        >
        <p id="lan-search-status" class="muted" role="status"></p>
        <div id="lan-hosts"></div>
      </section>
      <template id="lan-login-template">
        <div class="lan-fold"
          ><div
            ><div class="lan-auth">
              <p class="pair-required muted" hidden
                >请从主机获取配对链接，再粘贴到上方连接。</p
              >
              <form class="lan-login" autocomplete="off">
                <label for="host-password">局域网密码</label>
                <div class="row"
                  ><div class="password-field"
                    ><input
                      id="host-password"
                      type="password"
                      required
                      maxlength="256"
                      autocomplete="off"
                    ></div
                  ><button class="primary" type="submit">连接</button></div
                >
                <p class="input-error" role="alert"></p>
              </form>
            </div></div
          ></div
        >
      </template>
      <details id="ssh-connection">
        <summary>通过 SSH 连接</summary>
        <form id="ssh-form" autocomplete="off">
          <label for="ssh-host">主机</label>
          <input id="ssh-host" name="host" required maxlength="253">
          <label for="ssh-port">SSH 端口</label>
          <input
            id="ssh-port"
            name="port"
            type="number"
            min="1"
            max="65535"
            value="22"
            required
          >
          <label for="ssh-user">用户</label>
          <input id="ssh-user" name="username" required maxlength="256">
          <label for="ssh-key">本机私钥路径（可选）</label>
          <input id="ssh-key" name="identityFile">
          <label for="ssh-secret">密码或私钥口令（可选）</label>
          <input id="ssh-secret" name="secret" type="password">
          <label for="ssh-wingmate">目标上的 Wingmate 路径（可选）</label>
          <input
            id="ssh-wingmate"
            name="executable"
            placeholder="/home/user/wingmate"
          >
          <p id="ssh-fingerprint" class="muted" role="status" hidden></p>
          <button type="submit" class="primary">连接 SSH</button>
        </form>
      </details>
    </section>
    <section id="share" role="tabpanel" aria-labelledby="share-tab" hidden>
      <div class="row share-row">
        <p id="local-web-status" role="status">本机浏览器</p>
        <button
          id="local-pair"
          class="share-action"
          type="button"
          aria-live="polite"
          hidden
          >复制本机配对链接</button
        >
      </div>
      <div class="row share-row">
        <p id="share-status" class="muted" role="status"></p>
        <button id="share-enable" class="share-action" type="button" hidden
          >开启分享</button
        >
        <button id="share-pair" class="share-action" type="button" hidden
          >生成配对码</button
        >
      </div>
      <form id="lan-password-form" autocomplete="off" hidden>
        <div class="row" id="lan-password-row">
          <label for="local-lan-password">局域网密码</label>
          <span id="lan-password-status" class="muted">未设置</span>
          <div class="password-field" hidden
            ><input
              id="local-lan-password"
              type="password"
              readonly
              maxlength="256"
              autocomplete="off"
            ></div
          >
          <button id="lan-password-edit" type="button">设置</button>
          <button id="lan-password-disable" type="button" hidden>停用</button>
          <button id="lan-password-save" type="submit" class="primary" hidden
            >保存</button
          >
        </div>
        <div id="lan-password-note" class="row muted" hidden>
          <span>局域网使用 HTTP，请在可信网络中启用。</span>
          <button id="lan-password-cancel" type="button">取消</button>
        </div>
      </form>
      <div id="share-result" hidden>
        <div class="pairing-card">
          <img id="share-code" width="124" height="124" alt="局域网配对二维码">
          <div class="pairing-details">
            <p class="pairing-heading">扫码配对</p>
            <p id="share-address" class="pairing-address"></p>
            <details id="share-address-picker" hidden>
              <summary title="切换配对地址">
                <span id="share-address-value" class="pairing-address"></span>
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  aria-hidden="true"
                  ><path d="m4 6 4 4 4-4" /></svg
                >
              </summary>
              <div
                id="share-address-options"
                role="group"
                aria-label="配对地址"
              ></div>
            </details>
            <button id="share-copy" type="button" aria-live="polite"
              >复制链接</button
            >
            <p class="muted">5 分钟内可用一次</p>
          </div>
        </div>
        <p id="share-link" class="pairing-address" hidden></p>
      </div>
      <p class="settings-hint muted">在「Wingmate 后台服务」管理分享和设备。</p>
    </section>
    <section id="tunnel" role="tabpanel" aria-labelledby="tunnel-tab" hidden>
      <div class="row" role="group" aria-label="隧道模式">
        <button type="button" data-mode="quick" aria-pressed="true"
          >临时隧道</button
        >
        <button type="button" data-mode="named" aria-pressed="false"
          >具名隧道</button
        >
      </div>
      <p id="tunnel-status" class="muted" role="status">正在读取隧道状态…</p>
      <progress id="tunnel-progress" aria-label="下载进度" hidden></progress>
      <p id="tunnel-address" class="pairing-address" hidden></p>
      <p id="tunnel-hint" class="muted" hidden></p>
      <div id="tunnel-actions" class="row">
        <button id="tunnel-start" type="button" hidden>开启隧道</button>
        <button id="tunnel-stop" type="button" hidden>关闭</button>
        <select id="tunnel-duration" aria-label="邀请有效期" hidden
          ><option value="5m">5 分钟</option
          ><option value="24h">24 小时</option></select
        >
        <button id="tunnel-pair" type="button" hidden>生成配对码</button>
        <button id="tunnel-settings" type="button" hidden>前往配置</button>
      </div>
      <div id="tunnel-invite" class="row" hidden>
        <span id="tunnel-expiry" class="muted" role="status"></span>
        <button id="tunnel-revoke" type="button" hidden>撤销邀请</button>
      </div>
      <div id="tunnel-result" hidden>
        <div class="pairing-card">
          <img id="tunnel-code" width="124" height="124" alt="公网配对二维码">
          <div class="pairing-details">
            <p class="pairing-heading">扫码配对</p>
            <button id="tunnel-copy" type="button" aria-live="polite"
              >复制链接</button
            >
            <p id="tunnel-pair-expiry" class="muted"></p>
          </div>
        </div>
        <p id="tunnel-link" class="pairing-address" hidden></p>
      </div>
    </section>
    <p id="message" role="alert"></p>
  </dialog>
  <script type="module" src="./connections.js"></script>
</html>
