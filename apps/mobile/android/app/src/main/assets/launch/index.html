<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Wingmate</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="connection.js"></script>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="128" height="76" viewBox="0 26 128 76" fill="currentColor" aria-hidden="true">
          <g transform="translate(-3 -1)">
            <path d="
              M 65 73
              C 60 80 53 85 45 86
              Q 42 87 44 84
              C 48 81 50 77 51 73
              Z"/>
            <path fill-rule="evenodd" d="
              M 36 62
              C 43 64 50 62 55 59
              C 54 57 53 54 54 52
              Q 54 51 56 52
              C 59 52 62 54 64 54
              C 74 48 83 40 94 40
              C 106 40 114 47 114 58
              C 114 70 103 78 88 80
              C 82 89 71 96 59 98
              Q 56 98 58 96
              C 62 92 65 87 67 82
              C 48 82 36 75 30 65
              C 22 65 16 61 13 54
              Q 12 51 15 51
              C 22 50 28 52 32 56
              C 34 50 39 45 45 43
              Q 47 42 47 44
              C 48 52 44 59 36 62
              Z
              M 103.25 55
              A 3.25 3.25 0 1 0 96.75 55
              A 3.25 3.25 0 1 0 103.25 55
              Z"/>
          </g>
        </svg>
        <h1>Wingmate</h1>
        <div id="scan-progress" hidden>
          <span class="breathing-light" aria-hidden="true"><i></i><i></i><i></i></span>
          <p id="scan-message" role="status"></p>
          <button id="cancel-scan" class="ghost" type="button" data-i18n="common.cancel">取消</button>
        </div>
      </div>
      <div class="actions">
        <p id="notice" role="status" hidden></p>
        <button id="local-agent" type="button" hidden data-i18n="localAgent.title">本机 Agent</button>
        <button id="discover" class="primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 6-6m-6 6h.01"/></svg>
          <span data-i18n="connection.autoScan">自动扫描局域网</span>
        </button>
        <button id="scan" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2m10 0h2a1 1 0 0 1 1 1v2m0 10v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2m0-5h16"/></svg>
          <span data-i18n="scan.scanQr">扫码连接</span>
        </button>
        <button id="history" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 1 2.6 6.4M3 12V5m0 7h7m2-4v4l3 2"/></svg>
          <span data-i18n="connection.recentConnections">最近连接</span>
        </button>
        <button id="settings" class="ghost" type="button" data-i18n="settings.title">设置</button>
      </div>
    </main>
  </body>
</html>
