name: Build and release Wingmate

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wingmate-release-${{ github.ref }}
  cancel-in-progress: false

env:
  npm_config_registry: https://registry.npmjs.org/

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Check release version
        if: github.event_name == 'push'
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $desktopVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $launcherVersion = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq wingmate-launcher | Select-Object -ExpandProperty version
          if ($env:GITHUB_REF_NAME -cne "v$version" -or $desktopVersion -cne $version -or $launcherVersion -cne $version) {
            throw "The tag, package.json, Tauri config and Rust workspace must use the same version."
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:smoke
      - name: Stage single-file EXE
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item target/release/wingmate.exe release/wingmate-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: wingmate-windows
          path: release/wingmate-windows-x64.exe
          if-no-files-found: error
          overwrite: true

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test apps/mobile/test/*.test.mjs
      - name: Build remote APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:testRemoteDebugUnitTest :app:assembleRemoteRelease --no-daemon
      - name: Sign and verify remote APK
        env:
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/wingmate-android.p12"
          trap 'rm -f -- "$keystore"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            : "${KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}"
            : "${KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD}"
            : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS}"
            : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD}"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            export KEYSTORE_PASSWORD=android KEY_ALIAS=wingmate-test KEY_PASSWORD=android
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Wingmate Test'
          fi

          tools="$ANDROID_HOME/build-tools/36.0.0"
          version="$(node -p "require('./package.json').version")"
          mkdir release
          source="apps/mobile/android/app/build/outputs/apk/remote/release/app-remote-release-unsigned.apk"
          apk="release/wingmate-android-remote.apk"
          "$tools/apksigner" sign --v4-signing-enabled false --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$source"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging"
          "$tools/aapt" list "$apk" > "$RUNNER_TEMP/apk-files"
          if grep -Eq '^(assets/runtime/|lib/)' "$RUNNER_TEMP/apk-files"; then
            echo "::error::Remote APK contains local runtime files"
            exit 1
          fi
          grep -F "package: name='dev.wingmate.mobile' " "$RUNNER_TEMP/apk-badging"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            grep -F "versionName='$version'" "$RUNNER_TEMP/apk-badging"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wingmate-android
          path: release/wingmate-android-remote.apk
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push'
    needs: [windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wingmate-*
          path: release
          merge-multiple: true
      - name: Publish Windows and Android packages
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$(gh api "repos/$GH_REPO/commits/tags/$tag" --jq .sha)" == "$GITHUB_SHA" ]]
          files=(wingmate-windows-x64.exe wingmate-android-remote.apk)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          files+=(SHA256SUMS.txt)

          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" --verify-tag --draft --generate-notes "${flags[@]}"
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false
