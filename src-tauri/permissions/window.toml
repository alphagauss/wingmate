[[permission]]
identifier = "allow-window-chrome"
description = "Allows the Wingmate home page or verified DSH workbench to operate its own title bar."
commands.allow = ["window_chrome"]

[[permission]]
identifier = "allow-open-connections"
description = "Allows the home page or verified local workbench to open the connection popover and return from a remote workbench."
commands.allow = ["open_connections", "return_local"]

[[permission]]
identifier = "allow-remote-workbench"
description = "Allows the connection popover to connect to a remote workbench and manage its own window."
commands.allow = ["connect_remote", "resize_connections", "close_connections", "open_tunnel_settings"]

[[permission]]
identifier = "allow-local-share"
description = "Allows the local connection panel or verified local workbench to manage local sharing."
commands.allow = ["local_share"]
