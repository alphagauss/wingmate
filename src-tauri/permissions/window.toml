[[permission]]
identifier = "allow-window-chrome"
description = "Allows the Wingmate home page or verified DSH workbench to operate its own title bar."
commands.allow = ["window_chrome"]

[[permission]]
identifier = "allow-open-connections"
description = "Allows the home page or verified local workbench to open the connection popover and return from a remote workbench."
commands.allow = ["open_connections", "return_local"]

[[permission]]
identifier = "allow-return-local"
description = "Allows a remote workbench to return to the local workbench."
commands.allow = ["return_local"]

[[permission]]
identifier = "allow-remote-workbench"
description = "Allows the connection popover to connect to a remote workbench and close itself."
commands.allow = ["connect_remote", "scan_lan", "cancel_lan_scan", "connection_history", "close_connections", "open_tunnel_settings"]

[[permission]]
identifier = "allow-workspace-connections"
description = "Allows the verified local workbench to operate its connection settings."
commands.allow = ["connect_remote", "scan_lan", "cancel_lan_scan", "connection_history", "open_lan_password"]

[[permission]]
identifier = "allow-local-share"
description = "Allows the local connection panel or verified local workbench to manage local sharing."
commands.allow = ["local_share"]
