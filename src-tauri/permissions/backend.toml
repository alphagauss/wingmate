[[permission]]
identifier = "allow-home-backend"
description = "Allows the Wingmate home page to start, connect to or update its backend."
commands.allow = ["home_backend"]

[[permission]]
identifier = "allow-manage-backend"
description = "Allows the verified DSH workbench to stop, restart or update its backend."
commands.allow = ["manage_backend"]

[[permission]]
identifier = "allow-backend-settings"
description = "Allows the verified DSH workbench to open its data directory and manage Wingmate login startup and the DSH command."
commands.allow = ["open_dsh_home", "login_startup", "dsh_command"]
