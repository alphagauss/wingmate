[package]
name = "wingmate"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
wingmate-service = { path = "../crates/wingmate-service", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
open = { version = "5", features = ["shellexecute-on-windows"] }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(all(not(windows), not(target_os = "linux")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Tauri dev 移除 custom-protocol，直接用 Cargo 构建时仍默认携带运行包。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "wingmate-service/bundled-runtime"]
