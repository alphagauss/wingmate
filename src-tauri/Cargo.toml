[package]
name = "wingmate-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
anyhow = "1"
wingmate-launcher = { path = "../crates/wingmate-launcher", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
fs2 = "0.4"
tempfile = "3"
open = { version = "5", features = ["shellexecute-on-windows"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
russh = { version = "0.61.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
semver = "1"
if-addrs = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
cookie = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[target.'cfg(all(not(windows), not(target_os = "linux")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Tauri dev 移除 custom-protocol；发行桌面只读取运行清单，不内嵌资源。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "wingmate-launcher/release-client"]
