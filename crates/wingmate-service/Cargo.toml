[package]
name = "wingmate-service"
version.workspace = true
edition.workspace = true

[features]
default = ["bundled-runtime"]
bundled-runtime = ["dep:dirs", "dep:zstd", "dep:tar"]

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dependencies]
anyhow = "1"
dirs = { version = "6", optional = true }
fs2 = "0.4"
zstd = { version = "0.13", default-features = false, optional = true }
tar = { version = "0.4", optional = true }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
