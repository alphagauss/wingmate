[package]
name = "wingmate-service"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
fs2 = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
tiny_http = "0.12"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
